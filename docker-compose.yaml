version: '3.8'
services:
  db:
    image: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is not set, see .env.example}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set, see .env.example}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is not set, see .env.example}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h localhost"]
      interval: 10s
      retries: 5
      timeout: 5s
    networks:
      - mynetwork
  
  url-shortener-api:    
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    networks:
      - mynetwork
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      # don't start serving until the schema exists
      liquibase:
        condition: service_completed_successfully
  
  liquibase:
    image: liquibase/liquibase:4.9.1
    container_name: Liquibase_container
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./infrastructure/changelog/:/liquibase/changelog/
    # Credentials are passed as arguments: Liquibase Community 4.9 ignores the
    # LIQUIBASE_COMMAND_* environment variables. Liquibase always runs inside the
    # compose network, so it connects to db:5432 whatever DB_HOST is set to.
    command:
      - --defaults-file=/liquibase/changelog/liquibase.properties
      - --url=jdbc:postgresql://db:5432/${DB_NAME}
      - --username=${DB_USER}
      - --password=${DB_PASSWORD}
      - update
    networks:
      - mynetwork

volumes:
  postgres_data:

networks:
  mynetwork:
    driver: bridge

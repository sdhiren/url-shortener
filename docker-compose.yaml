version: '3.8'
services:
  db:
    image: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is not set, see .env.example}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set, see .env.example}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is not set, see .env.example}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h localhost"]
      interval: 10s
      retries: 5
      timeout: 5s
    networks:
      - mynetwork
  
  url-shortener-api:    
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    networks:
      - mynetwork
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
  
  liquibase:
    image: liquibase/liquibase:4.9.1
    container_name: Liquibase_container
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./infrastructure/changelog/:/liquibase/changelog/
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://${DB_HOST:-db}:${DB_PORT:-5432}/${DB_NAME}
      LIQUIBASE_COMMAND_USERNAME: ${DB_USER}
      LIQUIBASE_COMMAND_PASSWORD: ${DB_PASSWORD}
    # Command to run the liquibase update service
    command: --defaults-file=/liquibase/changelog/liquibase.properties update
    networks:
      - mynetwork

volumes:
  postgres_data:

networks:
  mynetwork:
    driver: bridge
